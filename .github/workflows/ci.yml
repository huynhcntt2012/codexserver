name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/collect-node-licenses.mjs
      - uses: actions/upload-artifact@v4
        with: { name: node-license-notices, path: build/licenses/node }

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.13.0, enable-cache: true }
      - run: uv sync --locked --project apps/api --python 3.12
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - run: cd apps/api && uv run pytest
      - run: uv run --project apps/api python scripts/collect-python-licenses.py
      - uses: actions/upload-artifact@v4
        with: { name: python-license-notices, path: build/licenses/python }

  client-and-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-godot.sh /tmp/godot
      - run: GODOT=/tmp/godot/godot python3 scripts/check-godot.py
      - name: Create ephemeral CI configuration
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
      - run: docker compose up -d --build --wait
      - run: /tmp/godot/godot --headless --path apps/client --script res://tests/smoke.gd
      - name: Build client resource pack
        run: |
          mkdir -p apps/client/build
          /tmp/godot/godot --headless --path apps/client --export-pack Linux build/suni-bomb-arena.pck
      - uses: actions/upload-artifact@v4
        with: { name: godot-client-pack, path: apps/client/build/*.pck }
      - if: failure()
        run: docker compose logs --tail=120
      - if: always()
        run: docker compose down -v

  desktop-playtest:
    needs: [arena, api, client-and-stack]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-godot.sh /tmp/godot
      - uses: actions/cache@v4
        id: templates
        with:
          path: build/godot-data/godot/export_templates/4.4.1.stable
          key: godot-desktop-templates-4.4.1-v1
      - if: steps.templates.outputs.cache-hit != 'true'
        run: bash scripts/install-godot-templates.sh
      - run: GODOT=/tmp/godot/godot python3 scripts/build-playtest.py
      - run: cd build/playtest && sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-playtest
          path: build/playtest/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-playtest:
    needs: desktop-playtest
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-playtest
          path: playtest
      - name: Launch the standalone Windows client
        shell: pwsh
        run: |
          Expand-Archive playtest/suni-bomb-arena-windows-x86_64.zip -DestinationPath playtest/unpacked
          $binary = Resolve-Path playtest/unpacked/suni-bomb-arena-windows-x86_64/suni-bomb-arena.exe
          $log = Join-Path $env:RUNNER_TEMP "suni-windows.log"
          $process = Start-Process -FilePath $binary -ArgumentList @("--headless", "--quit-after", "3", "--log-file", $log) -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw "Windows client startup timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Windows client exited with $($process.ExitCode)" }
          if (-not (Test-Path $log)) { throw "Windows client did not write a runtime log" }
          Get-Content $log
          if (Select-String -Path $log -Pattern "SCRIPT ERROR|ERROR:") {
            throw "Windows client reported a runtime error"
          }
