name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/collect-node-licenses.mjs
      - uses: actions/upload-artifact@v4
        with: { name: node-license-notices, path: build/licenses/node }

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.13.0, enable-cache: true }
      - run: uv sync --locked --project apps/api --python 3.12
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - run: cd apps/api && uv run pytest
      - run: uv run --project apps/api python scripts/collect-python-licenses.py
      - uses: actions/upload-artifact@v4
        with: { name: python-license-notices, path: build/licenses/python }

  client-and-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-godot.sh /tmp/godot
      - run: GODOT=/tmp/godot/godot python3 scripts/check-godot.py
      - name: Create ephemeral CI configuration
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
      - run: docker compose up -d --build --wait
      - run: /tmp/godot/godot --headless --path apps/client --script res://tests/smoke.gd
      - name: Build client resource pack
        run: |
          mkdir -p apps/client/build
          /tmp/godot/godot --headless --path apps/client --export-pack Linux build/suni-bomb-arena.pck
      - uses: actions/upload-artifact@v4
        with: { name: godot-client-pack, path: apps/client/build/*.pck }
      - if: failure()
        run: docker compose logs --tail=120
      - if: always()
        run: docker compose down -v
