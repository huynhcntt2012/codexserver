[project]
name = "suni-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.3,<1",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2.9,<4",
  "redis>=6.2.0,<7",
  "PyJWT>=2.10.1,<3",
  "pwdlib[argon2]>=0.2.1,<1",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9", "httpx>=0.28.1,<1", "ruff>=0.11.13,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
