server {
    listen 8080;
    server_tokens off;
    # Relative redirects: the public host and port come from the tunnel, not nginx.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    types {
        text/html html;
        text/css css;
        image/svg+xml svg;
        image/png png;
        image/webp webp;
        application/wasm wasm;
        application/octet-stream pck;
        audio/wav wav;
        application/javascript js mjs;
        text/plain txt;
        application/json json;
    }
    client_max_body_size 8k;
    # Do not write credentials or WebSocket session query strings to logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream;
    gzip_min_length 1024;
    location /practice/engine/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;
        try_files $uri =404;
        expires -1;
    }
    location = /health { return 200 'ok'; }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 15s;
    }
    # Admin portal API: FastAPI /admin/v1 with its own admin tokens and audit log.
    location /admin/api/ {
        proxy_pass http://api:8000/admin/v1/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 15s;
        # Item icon uploads are PNGs up to 10 MB (API cap MAX_ICON_BYTES).
        client_max_body_size 11m;
        add_header Cache-Control "no-store" always;
    }
    location /admin/_next/static/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Static admin pages (Next.js export). Not indexed, never framed.
    location /admin/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ $uri/index.html /admin/404.html;
        expires -1;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /practice/ {
        try_files $uri $uri/ =404;
        expires -1;
    }
    # Web playtest game (login, online rooms): /demo/.
    location /demo/ {
        try_files $uri $uri/ =404;
        expires -1;
    }
    location = /demo {
        return 301 /demo/;
    }
    # The promotion website used to live under /adminportal/; keep old links working.
    location /adminportal/ {
        rewrite ^/adminportal/(.*)$ /$1 permanent;
    }
    location = /adminportal {
        return 301 /;
    }
    # Game builds published by scripts/publish-release.py (mounted read-only).
    location /releases/ {
        alias /usr/share/nginx/releases/;
        add_header X-Content-Type-Options nosniff always;
        expires -1;
    }
    location /arena/ {
        proxy_pass http://arena:2567/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 75s;
    }
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
        try_files $uri =404;
    }
    # Promotion website (docs/PORTAL.md) at the site root: static pages, own 404.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ $uri/index.html =404;
        error_page 404 /404.html;
        expires 5m;
    }
}
