server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    types {
        text/html html;
        text/css css;
        image/svg+xml svg;
        application/javascript js mjs;
        text/plain txt;
    }
    client_max_body_size 8k;
    # Do not write credentials or WebSocket session query strings to logs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /health { return 200 'ok'; }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 15s;
    }
    location /arena/ {
        proxy_pass http://arena:2567/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 75s;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
